name: QA CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      run_security:
        description: "Lancer le scan ZAP sur Formy (1 = oui)"
        required: false
        default: "0"

jobs:
  ui:
    name: Tests UI Selenium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      selenium:
        image: selenium/standalone-chrome:4.27.0-20241204
        ports:
          - 4444:4444
        options: --shm-size=2g
    env:
      SELENIUM_REMOTE_URL: http://localhost:4444
      SELENIUM_STARTUP_TIMEOUT: "90"
      SE_NODE_MAX_SESSIONS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/wait_selenium.py
      - name: Execution pytest
        run: python -m pytest --clean-alluredir --alluredir=reports/allure-results --junitxml=reports/ui/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-reports
          path: |
            reports/ui/
            reports/allure-results/
          retention-days: 30

  api:
    name: Tests API Postman/Newman
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run test:api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-reports
          path: reports/api/
          retention-days: 30

  api-negative:
    name: Tests API negatifs (non bloquant)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run test:api:negative
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-negative-reports
          path: reports/api-negative/
          retention-days: 30

  allure:
    name: Rapport Allure
    runs-on: ubuntu-latest
    needs: ui
    if: always() && needs.ui.result != 'skipped'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-reports
          path: reports/
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check-allure-results.cjs
      - run: npm ci
      - run: npx --no-install allure generate reports/allure-results --clean -o reports/allure-html
      - uses: actions/upload-artifact@v4
        with:
          name: allure-html
          path: reports/allure-html/
          retention-days: 30

  security:
    name: Scan OWASP ZAP (manuel)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_security == '1'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: ZAP baseline
        run: |
          mkdir -p reports/security zapwrk
          cp security/baseline.conf zapwrk/
          chmod -R 777 zapwrk
          docker run --rm -v "$PWD/zapwrk:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t https://formy-project.herokuapp.com -m 1 -T 5 \
            -c baseline.conf -r zap.html -J zap.json -w zap.md || echo "zap exit $?"
          cp zapwrk/zap.* reports/security/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: reports/security/
          retention-days: 30