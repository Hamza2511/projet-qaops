stages: [test, report]

ui:
  stage: test
  image: python:3.12-slim
  services:
    - name: selenium/standalone-chrome:4.27.0-20241204
      alias: selenium
      variables:
        HEALTHCHECK_TCP_PORT: '4444'
  variables:
    SELENIUM_REMOTE_URL: http://selenium:4444
    SELENIUM_STARTUP_TIMEOUT: '60'
    SE_NODE_MAX_SESSIONS: '1'
    NO_PROXY: selenium,localhost,127.0.0.1
    no_proxy: selenium,localhost,127.0.0.1
  timeout: 10 minutes
  before_script:
    - rm -rf reports/ui reports/allure-results
    - python -m pip install -r requirements.txt
    - python scripts/wait_selenium.py
  script:
    - python -m pytest --clean-alluredir --alluredir=reports/allure-results --junitxml=reports/ui/junit.xml
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/ui/, reports/allure-results/]
    reports:
      junit: reports/ui/junit.xml

api:
  stage: test
  image: node:22-bookworm-slim
  timeout: 5 minutes
  before_script:
    - rm -rf reports/api
    - npm ci
  script:
    - npm run test:api
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/api/]
    reports:
      junit: reports/api/junit.xml

allure:
  stage: report
  image: node:22-bookworm-slim
  when: always
  dependencies: [ui]
  timeout: 10 minutes
  before_script:
    - rm -rf reports/allure-html
    - node scripts/check-allure-results.cjs
    - apt-get update && apt-get install -y --no-install-recommends default-jre-headless
    - npm ci
  script:
    - npx --no-install allure generate reports/allure-results --clean -o reports/allure-html
  artifacts:
    when: always
    paths: [reports/allure-html/]
    expire_in: 30 days

security:
  stage: test
  image:
    name: ghcr.io/zaproxy/zaproxy:stable
    entrypoint: ['']
  # Explicit opt-in when starting a pipeline; no public scan on every push.
  rules:
    - if: '$RUN_SECURITY == "1"'
      when: on_success
    - when: never
  timeout: 10 minutes
  allow_failure:
    exit_codes: [2]
  script:
    - rm -rf reports/security
    - mkdir -p /zap/wrk reports/security
    - cp security/baseline.conf /zap/wrk/
    - cd /zap/wrk
    - |
      code=0
      zap-baseline.py -t https://formy-project.herokuapp.com -m 1 -T 5 -c baseline.conf -r zap.html -J zap.json -w zap.md || code=$?
      printf '%s\n' "$code" > "$CI_PROJECT_DIR/reports/security/exit-code.txt"
      for report in zap.html zap.json zap.md; do
        if [ -f "$report" ]; then
          cp "$report" "$CI_PROJECT_DIR/reports/security/"
        fi
      done
      exit "$code"
  artifacts:
    when: always
    paths: [reports/security/]
    expire_in: 30 days
