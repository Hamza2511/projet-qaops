<!doctype html><html lang="fr"><meta charset="utf-8"><title>QAOps - fixture locale</title>
<style>body{font:18px system-ui;max-width:850px;margin:50px auto;color:#17324d}input,button{padding:12px;margin:6px}iframe{display:block;width:100%;height:220px;border:1px solid #bbb}</style>
<h1 id="page-title">Complément pédagogique QAOps</h1>
<p>Fixture de test uniquement : cette page ne fait pas partie de Formy. La connexion simulée ne protège aucune donnée.</p>
<form id="login-form"><label>Courriel <input id="email" type="email" required></label><label>Mot de passe <input id="password" type="password" required></label><button id="login">Connexion</button></form>
<p id="status" role="status"></p><h2>Exercice iframe</h2><iframe id="student-frame" title="Saisie étudiant" src="student.html"></iframe>
<script>document.getElementById('login-form').addEventListener('submit',e=>{e.preventDefault();document.getElementById('status').textContent=document.getElementById('email').value==='sara@example.test'&&document.getElementById('password').value==='QaOps-demo-2026'?'Bienvenue Sara':'Identifiants invalides';});</script></html>
